services:
  db:
    image: postgres:18.2
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    networks:
      - internal_network
    ports:
      - "5432:5432"

  adminer:
    image: adminer:latest
    environment:
      ADMINER_DEFAULT_SERVER:
      ADMINER_DESIGN: nette
    networks:
      - internal_network
      - external_network
    ports:
      - "8080:8080"

  api:
    build: ./api
    networks:
      - internal_network
      - external_network
    environment:
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=${DB_NAME};Username=${DB_USER};Password=${DB_PASSWORD}
      - Jwt__Key=${JWT_KEY}
      - Jwt__Issuer=${JWT_ISSUER}
      - Jwt__Audience=${JWT_AUDIENCE}
    volumes:
      - ./user_uploads:/app/wwwroot/uploads
    ports:
      - "5000:8080"
    depends_on:
      db:
        condition: service_healthy

networks:
  internal_network:
    internal: true
  external_network:
